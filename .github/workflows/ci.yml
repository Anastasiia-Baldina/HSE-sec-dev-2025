name: CI/CD Minimal Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 black==24.8.0 isort==5.13.2 pre-commit==3.8.0

      - name: Create reports directory
        run: mkdir -p reports/lint

      - name: Run pre-commit hooks
        run: |
          pre-commit install
          pre-commit run --all-files --show-diff-on-failure 2>&1 | tee reports/lint/pre-commit.txt

      - name: Run Ruff
        run: |
          ruff check --output-format=github . 2>&1 | tee reports/lint/ruff.txt
          ruff format --check . 2>&1 | tee reports/lint/ruff-format.txt

      - name: Run Black
        run: |
          black --check --verbose . 2>&1 | tee reports/lint/black.txt

      - name: Run isort
        run: |
          isort --check-only --diff . 2>&1 | tee reports/lint/isort.txt

      - name: Upload linting reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linting-reports
          path: reports/lint/
          retention-days: 30

  test:
    name: "Test"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/virtualenvs
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-
            pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest-cov

      - name: Create test reports directory
        run: mkdir -p reports/test-${{ matrix.python-version }}

      - name: Run tests with coverage
        run: |
          echo "Running tests for Python ${{ matrix.python-version }}..." > reports/test-${{ matrix.python-version }}/test-run.txt

          pytest -v \
            --junitxml=reports/test-${{ matrix.python-version }}/junit.xml \
            --cov=app \
            --cov-report=xml:reports/test-${{ matrix.python-version }}/coverage.xml \
            --cov-report=html:reports/test-${{ matrix.python-version }}/coverage-html \
            --cov-report=term-missing:skip-covered \
            --tb=short 2>&1 | tee reports/test-${{ matrix.python-version }}/pytest.txt

      - name: Generate coverage summary
        run: |
          echo "### Python ${{ matrix.python-version }} Coverage" >> $GITHUB_STEP_SUMMARY

          if [ -f "reports/test-${{ matrix.python-version }}/coverage.xml" ]; then
            COVERAGE_LINE=$(grep -o 'line-rate="[0-9.]*"' reports/test-${{ matrix.python-version }}/coverage.xml | head -1)
            COVERAGE_BRANCH=$(grep -o 'branch-rate="[0-9.]*"' reports/test-${{ matrix.python-version }}/coverage.xml | head -1)

            if [ -n "$COVERAGE_LINE" ]; then
              LINE_RATE=$(echo $COVERAGE_LINE | sed 's/[^0-9.]//g')
              LINE_PERCENT=$(echo "$LINE_RATE * 100" | bc -l | xargs printf "%.1f")

              FILLED=$(printf "█%.0s" $(seq 1 $(echo "$LINE_PERCENT / 4" | bc)))
              EMPTY=$(printf "░%.0s" $(seq 1 $(echo "(100 - $LINE_PERCENT) / 4" | bc)))

              echo "**Coverage: ${LINE_PERCENT}%**" >> $GITHUB_STEP_SUMMARY
              echo "\`${FILLED}${EMPTY}\`" >> $GITHUB_STEP_SUMMARY

              if [ -n "$COVERAGE_BRANCH" ]; then
                BRANCH_RATE=$(echo $COVERAGE_BRANCH | sed 's/[^0-9.]//g')
                BRANCH_PERCENT=$(echo "$BRANCH_RATE * 100" | bc -l | xargs printf "%.1f")
                echo "**Branch coverage: ${BRANCH_PERCENT}%**" >> $GITHUB_STEP_SUMMARY
              fi

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Download reports:" >> $GITHUB_STEP_SUMMARY
              echo "- [HTML Coverage](artifact:test-reports-${{ matrix.python-version }}/coverage-html/index.html)" >> $GITHUB_STEP_SUMMARY
              echo "- [JUnit XML Report](artifact:test-reports-${{ matrix.python-version }}/junit.xml)" >> $GITHUB_STEP_SUMMARY
              echo "- [Coverage XML Report](artifact:test-reports-${{ matrix.python-version }}/coverage.xml)" >> $GITHUB_STEP_SUMMARY
              echo "- [Pytest Text Log](artifact:test-reports-${{ matrix.python-version }}/pytest.txt)" >> $GITHUB_STEP_SUMMARY
              echo "- [Test Run Info](artifact:test-reports-${{ matrix.python-version }}/test-run.txt)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/test-${{ matrix.python-version }}/
          retention-days: 90
          overwrite: true

  build-docker:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 8

    if: true

    env:
      REGISTRY: ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ github.sha }}
          restore-keys: |
            buildx-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/anastasiia-baldina/hse-sec-dev-2025:latest
            ghcr.io/anastasiia-baldina/hse-sec-dev-2025:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          platforms: linux/amd64

      - name: Update Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Show image details
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/anastasiia-baldina/hse-sec-dev-2025\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/anastasiia-baldina/hse-sec-dev-2025:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [lint, test, build-docker]
    timeout-minutes: 2

    if: always()

    steps:
      - name: Generate comprehensive summary
        run: |
          echo "# CI/CD Pipeline Results" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Execution Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** \`${{ github.workflow }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Lint & Format** | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests (Python 3.11)** | ${{ needs.test.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests (Python 3.12)** | ${{ needs.test.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests (Python 3.13)** | ${{ needs.test.result == 'success' && 'Success' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Build** | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Available Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "### Linting Reports (linting-reports artifact)" >> $GITHUB_STEP_SUMMARY
          echo "- pre-commit.txt - Pre-commit hooks output" >> $GITHUB_STEP_SUMMARY
          echo "- ruff.txt - Ruff linting output" >> $GITHUB_STEP_SUMMARY
          echo "- ruff-format.txt - Ruff formatting output" >> $GITHUB_STEP_SUMMARY
          echo "- black.txt - Black formatting output" >> $GITHUB_STEP_SUMMARY
          echo "- isort.txt - isort import sorting output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Reports (test-reports-* artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "For each Python version (3.11, 3.12, 3.13):" >> $GITHUB_STEP_SUMMARY
          echo "- junit.xml - JUnit test results (XML format)" >> $GITHUB_STEP_SUMMARY
          echo "- coverage.xml - Coverage data (XML format)" >> $GITHUB_STEP_SUMMARY
          echo "- pytest.txt - Pytest console output (text format)" >> $GITHUB_STEP_SUMMARY
          echo "- test-run.txt - Test execution info (text format)" >> $GITHUB_STEP_SUMMARY
          echo "- coverage-html/ - HTML coverage report (directory)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## How to Use Reports Locally" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# 1. Download artifacts from GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "# 2. Extract the zip files" >> $GITHUB_STEP_SUMMARY
          echo "unzip test-reports-3.12.zip" >> $GITHUB_STEP_SUMMARY
          echo "unzip linting-reports.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 3. View text reports" >> $GITHUB_STEP_SUMMARY
          echo "cat reports/test-3.12/pytest.txt" >> $GITHUB_STEP_SUMMARY
          echo "cat reports/lint/ruff.txt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 4. View HTML coverage report" >> $GITHUB_STEP_SUMMARY
          echo "cd reports/test-3.12/coverage-html && python -m http.server 8000" >> $GITHUB_STEP_SUMMARY
          echo "# Open http://localhost:8000 in browser" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "Available at: \`ghcr.io/anastasiia-baldina/hse-sec-dev-2025\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Pipeline completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY
