name: "P10 Security - SAST & Secrets"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'app/**'
      - 'security/semgrep/**'
      - 'security/.gitleaks.toml'
      - 'requirements*.txt'
      - '.github/workflows/ci-sast-secrets.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - 'app/**'
      - 'security/semgrep/**'
      - 'security/.gitleaks.toml'
      - 'requirements*.txt'
      - '.github/workflows/ci-sast-secrets.yml'

permissions:
  contents: read
  security-events: write

concurrency:
  group: sast-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-secrets:
    name: "Run SAST & Secrets Scanning"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create evidence directory
        run: |
          mkdir -p EVIDENCE/P10
          echo "SAST & Secrets scanning evidence for P10" > EVIDENCE/P10/README.md
          echo "Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> EVIDENCE/P10/README.md
          echo "Commit: ${{ github.sha }}" >> EVIDENCE/P10/README.md

      - name: Run Semgrep SAST scan
        run: |
          echo "Starting Semgrep SAST scan..."

          docker run --rm \
            -v "$PWD:/src" \
            -e SEMGREP_APP_TOKEN="" \
            returntocorp/semgrep:latest \
            semgrep scan \
            --config=p/ci \
            --config=security/semgrep/rules.yml \
            --sarif \
            --output=/src/EVIDENCE/P10/semgrep.sarif \
            --metrics=off \
            --no-rewrite-rule-ids \
            --strict \
            --error \
            /src || true

          echo "Semgrep scan completed"

          if [ -f "EVIDENCE/P10/semgrep.sarif" ]; then
            echo "SARIF report generated at EVIDENCE/P10/semgrep.sarif"

            if command -v jq > /dev/null; then
              COUNT=$(jq '.runs[0].results | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
              echo "Found $COUNT issues in SAST scan"
            fi
          else
            echo "WARNING: SARIF file not generated"
          fi

      - name: Run Gitleaks secrets scan
        run: |
          echo "Starting Gitleaks secrets scan..."

          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --config=/repo/security/.gitleaks.toml \
            --report-format=json \
            --report-path=/repo/EVIDENCE/P10/gitleaks.json \
            --no-banner \
            --verbose || true

          echo "Gitleaks scan completed"

          if [ -f "EVIDENCE/P10/gitleaks.json" ]; then
            echo "Gitleaks report generated at EVIDENCE/P10/gitleaks.json"

            if command -v jq > /dev/null; then
              COUNT=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
              echo "Found $COUNT potential secrets"
            fi
          else
            echo "WARNING: Gitleaks report not generated"
          fi

      - name: Generate security summary
        run: |
          echo "# SAST & Secrets Scan Summary" > EVIDENCE/P10/sast_summary.md
          echo "Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> EVIDENCE/P10/sast_summary.md
          echo "Commit: ${{ github.sha }}" >> EVIDENCE/P10/sast_summary.md
          echo "Workflow: ${{ github.workflow }}" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          echo "## Scan Configuration" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "### SAST (Semgrep)" >> EVIDENCE/P10/sast_summary.md
          echo "- Profile: p/ci (CI-optimized rules)" >> EVIDENCE/P10/sast_summary.md
          echo "- Custom rules: security/semgrep/rules.yml" >> EVIDENCE/P10/sast_summary.md
          echo "- Output format: SARIF" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          echo "### Secrets Scanning (Gitleaks)" >> EVIDENCE/P10/sast_summary.md
          echo "- Configuration: security/.gitleaks.toml" >> EVIDENCE/P10/sast_summary.md
          echo "- Scan type: Current repository state" >> EVIDENCE/P10/sast_summary.md
          echo "- Output format: JSON" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          echo "## Results Summary" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          echo "### SAST Findings" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          if [ -f "EVIDENCE/P10/semgrep.sarif" ] && command -v jq > /dev/null; then
            SAST_COUNT=$(jq '.runs[0].results | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")

            if [ "$SAST_COUNT" -gt "0" ]; then
              echo "Total SAST findings: $SAST_COUNT" >> EVIDENCE/P10/sast_summary.md
              echo "" >> EVIDENCE/P10/sast_summary.md

              echo "| Severity | Count |" >> EVIDENCE/P10/sast_summary.md
              echo "|----------|-------|" >> EVIDENCE/P10/sast_summary.md

              for level in error warning note; do
                COUNT=$(jq --arg lvl "$level" '.runs[0].results[] | select(.level == $lvl) | length' EVIDENCE/P10/semgrep.sarif | wc -l 2>/dev/null || echo "0")
                echo "| $level | $COUNT |" >> EVIDENCE/P10/sast_summary.md
              done

              echo "" >> EVIDENCE/P10/sast_summary.md
              echo "Top issues:" >> EVIDENCE/P10/sast_summary.md
              echo "" >> EVIDENCE/P10/sast_summary.md

              jq -r '.runs[0].results[0:5] | .[] | "- **\(.level)**: \(.ruleId) - \(.message.text)"' EVIDENCE/P10/semgrep.sarif 2>/dev/null >> EVIDENCE/P10/sast_summary.md || true
            else
              echo "No SAST findings detected" >> EVIDENCE/P10/sast_summary.md
            fi
          else
            echo "SAST report not available or jq not installed" >> EVIDENCE/P10/sast_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_summary.md

          echo "### Secrets Scan Findings" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          if [ -f "EVIDENCE/P10/gitleaks.json" ] && command -v jq > /dev/null; then
            SECRETS_COUNT=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")

            if [ "$SECRETS_COUNT" -gt "0" ]; then
              echo "Potential secrets found: $SECRETS_COUNT" >> EVIDENCE/P10/sast_summary.md
              echo "" >> EVIDENCE/P10/sast_summary.md

              echo "Sample findings:" >> EVIDENCE/P10/sast_summary.md
              echo "" >> EVIDENCE/P10/sast_summary.md

              jq -r '.[0:3] | .[] | "- **\(.RuleID)**: \(.Description) (in \(.File))"' EVIDENCE/P10/gitleaks.json 2>/dev/null >> EVIDENCE/P10/sast_summary.md || true

              echo "" >> EVIDENCE/P10/sast_summary.md
              echo "Action required: Review all findings in gitleaks.json" >> EVIDENCE/P10/sast_summary.md
            else
              echo "No potential secrets detected" >> EVIDENCE/P10/sast_summary.md
            fi
          else
            echo "Gitleaks report not available or jq not installed" >> EVIDENCE/P10/sast_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "## Next Steps" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "1. Review SAST findings: Check EVIDENCE/P10/semgrep.sarif for code quality and security issues" >> EVIDENCE/P10/sast_summary.md
          echo "2. Review secrets: Check EVIDENCE/P10/gitleaks.json for exposed credentials" >> EVIDENCE/P10/sast_summary.md
          echo "3. Prioritize fixes: Address high severity findings first" >> EVIDENCE/P10/sast_summary.md
          echo "4. Update allowlists: Add false positives to security/.gitleaks.toml if appropriate" >> EVIDENCE/P10/sast_summary.md
          echo "5. Track progress: Create issues for findings that need follow-up" >> EVIDENCE/P10/sast_summary.md

          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "## Files Generated" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "- semgrep.sarif: SAST findings in SARIF format" >> EVIDENCE/P10/sast_summary.md
          echo "- gitleaks.json: Secrets scan results in JSON format" >> EVIDENCE/P10/sast_summary.md
          echo "- sast_summary.md: This summary file" >> EVIDENCE/P10/sast_summary.md

          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "---" >> EVIDENCE/P10/sast_summary.md
          echo "This scan is part of Security Practice P10 - SAST & Secrets" >> EVIDENCE/P10/sast_summary.md

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: EVIDENCE/P10/semgrep.sarif
          wait-for-processing: false

      - name: Generate workflow summary
        run: |
          echo "# SAST & Secrets Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Scan Overview" >> $GITHUB_STEP_SUMMARY
          echo "- SAST Tool: Semgrep with p/ci profile and custom rules" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets Tool: Gitleaks with custom configuration" >> $GITHUB_STEP_SUMMARY
          echo "- SARIF Upload: Integrated with GitHub Code Scanning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "EVIDENCE/P10/sast_summary.md" ]; then
            echo "## Key Findings" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if grep -q "Total SAST findings:" EVIDENCE/P10/sast_summary.md; then
              SAST_LINE=$(grep "Total SAST findings:" EVIDENCE/P10/sast_summary.md)
              echo "$SAST_LINE" >> $GITHUB_STEP_SUMMARY
            else
              echo "No SAST findings" >> $GITHUB_STEP_SUMMARY
            fi

            if grep -q "Potential secrets found:" EVIDENCE/P10/sast_summary.md; then
              SECRETS_LINE=$(grep "Potential secrets found:" EVIDENCE/P10/sast_summary.md)
              echo "$SECRETS_LINE" >> $GITHUB_STEP_SUMMARY
            else
              echo "No secrets detected" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "## Generated Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All reports are available in the workflow artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- SAST Report: SARIF format (also in GitHub Code Scanning)" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets Report: JSON format" >> $GITHUB_STEP_SUMMARY
          echo "- Summary: Markdown summary with statistics" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Action Items" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Review findings in the downloaded artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Fix critical security issues immediately" >> $GITHUB_STEP_SUMMARY
          echo "3. Add false positives to allowlists as needed" >> $GITHUB_STEP_SUMMARY
          echo "4. Create backlog items for non-critical findings" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Security Practice P10 - SAST & Secrets" >> $GITHUB_STEP_SUMMARY

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-secrets-evidence-p10
          path: |
            EVIDENCE/P10/
            security/semgrep/rules.yml
            security/.gitleaks.toml
          retention-days: 90
          if-no-files-found: error
